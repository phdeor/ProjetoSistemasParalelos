services:
  broker:
    build: ./broker
    container_name: broker
    ports:
      - "5555:5555"
      - "5556:5556"
    networks:
      - bbs_net

  # ================= SERVIDORES PYTHON =================
  server_py_1:
    build: ./python
    container_name: server_py_1
    command: python -u server.py
    environment:
      - SERVER_NAME=server_py_1
      - BROKER_URL=tcp://broker:5556
    volumes:
      - ./data/server_py_1:/data
    depends_on:
      - broker
    networks:
      - bbs_net

  server_py_2:
    build: ./python
    container_name: server_py_2
    command: python -u server.py
    environment:
      - SERVER_NAME=server_py_2
      - BROKER_URL=tcp://broker:5556
    volumes:
      - ./data/server_py_2:/data
    depends_on:
      - broker
    networks:
      - bbs_net

  # ================= CLIENTES PYTHON =================
  client_py_1:
    build: ./python
    container_name: client_py_1
    command: python -u client.py
    environment:
      - CLIENT_NAME=bot_py_1
      - BROKER_URL=tcp://broker:5555
    depends_on:
      - broker
      - server_py_1
      - server_py_2
    networks:
      - bbs_net

  client_py_2:
    build: ./python
    container_name: client_py_2
    command: python -u client_py_2
    environment:
      - CLIENT_NAME=bot_py_2
      - BROKER_URL=tcp://broker:5555
    depends_on:
      - broker
      - server_py_1
      - server_py_2
    networks:
      - bbs_net
  
  # ================= JAVA =================

  cliente-java:
    build:
      context: ./java
      dockerfile: Dockerfile
    depends_on:
      - broker
    networks:
      - bbs_net
    environment:
      SERVER_ADDRESS: broker
      CLIENT_NAME: client_java
    command: ["java", "-cp", "app.jar", "com.sistema.ClientBotMain"]

  servidor-java:
    build:
      context: ./java
      dockerfile: Dockerfile
    depends_on:
      - broker
    networks:
      - bbs_net
    environment:
      SERVER_ADDRESS: broker
      SERVER_NAME: server_java
    command: ["java", "-cp", "app.jar", "com.sistema.ServerMain"]

networks:
  bbs_net:
    driver: bridge